<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f5b"><meta name="description" content="ZUNE Seller Dashboard">
<title>ZUNE | Seller Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:"DM Sans",sans-serif;color:#18352a;background:#f4f8f5}*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{max-width:1080px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font:800 18px Manrope;color:#087f5b}.mark{display:flex;gap:3px}.mark span{width:27px;height:27px;border:1.5px solid #087f5b;border-radius:50%;display:grid;place-items:center;font-size:12px;animation:wave 1.3s ease-in-out infinite}.mark span:nth-child(2){animation-delay:.12s}.mark span:nth-child(3){animation-delay:.24s}.mark span:nth-child(4){animation-delay:.36s}@keyframes wave{50%{transform:translateY(-5px)}}.signout{border:1px solid #dce8df;background:#fff;color:#315344;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.welcome{margin:38px 0 20px}.eyebrow{font-size:10px;letter-spacing:2px;color:#087f5b;font-weight:800}.welcome h1{font:800 clamp(26px,5vw,38px) Manrope;margin:8px 0;color:#173d2d}.welcome p{color:#78877f;font-size:13px}.store-card{background:#fff;border:1px solid #e5eee8;border-radius:22px;padding:24px;box-shadow:0 14px 40px #174a320d;display:flex;align-items:center;gap:18px}.store-logo{width:64px;height:64px;border-radius:18px;background:#eaf6ef;display:grid;place-items:center;color:#087f5b;font:800 24px Manrope;overflow:hidden;flex:none}.store-logo img{width:100%;height:100%;object-fit:cover}.store-meta{min-width:0}.store-meta h2{margin:0 0 5px;font:800 20px Manrope;color:#183b2d}.store-meta p{margin:0;color:#78877f;font-size:12px}.status{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 10px;border-radius:30px;background:#eaf6ef;color:#087f5b;font-size:10px;font-weight:800}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.notice{margin-top:18px;padding:16px 18px;border:1px solid #e3eee7;border-radius:14px;background:#f8fbf9;color:#60766a;font-size:12px;line-height:1.6}.loading{padding:70px 10px;text-align:center;color:#78877f;font-size:13px}.error{color:#b42318}@media(max-width:560px){.shell{padding:17px}.store-card{align-items:flex-start;padding:18px}.store-logo{width:54px;height:54px;border-radius:15px}.welcome{margin-top:28px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div class="brand"><div class="mark"><span>Z</span><span>U</span><span>N</span><span>E</span></div><span>SELLER</span></div><button id="signOut" class="signout">Toka</button></header>
<section id="content" class="loading" aria-live="polite">Tunafungua akaunti yako salama...</section>
</main>
<script type="module" src="./dashboard.js"></script>
</body>
</html>
