<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f5b"><title>ZUNE | OTP na Password</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="login.css"><style>.setup-stage{position:relative;z-index:1;width:min(100%,460px);background:#fff;border:1px solid #e8efea;border-radius:26px;padding:28px clamp(22px,6vw,42px);box-shadow:0 22px 70px #174a3212}.setup-stage h1{font:800 25px Manrope;color:#183b2d;margin:10px 0}.setup-stage p{font-size:12px;color:#78877f;line-height:1.6}.setup-stage label{margin-top:14px}.setup-stage .field{margin-bottom:12px}.setup-stage .submit-button{margin-top:10px}.setup-stage[hidden]{display:none!important}.stage-back{display:block;text-align:center;margin-top:16px;color:#087f5b;text-decoration:none;font-size:12px;font-weight:700}</style></head><body><main class="login-page"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><header class="brand-lockup"><div class="circle-logo"><span class="logo-letter">Z</span><span class="logo-letter">U</span><span class="logo-letter">N</span><span class="logo-letter">E</span></div><span class="portal-label">SELLER PORTAL</span></header><section class="setup-stage"><div class="card-topline"><div class="secure-mark">Ⓩ</div><div class="language-switch"><button class="lang-btn active" data-lang="sw" type="button">SW</button><span></span><button class="lang-btn" data-lang="en" type="button">EN</button></div></div><p class="eyebrow">UTHIBITISHO WA DUKA</p><h1 id="verifyTitle">Weka OTP na password mpya</h1><p id="storeCaption"></p><label for="otpCode">OTP ya email (tarakimu 8)</label><div class="field"><input id="otpCode" type="tel" inputmode="numeric" pattern="[0-9]{8}" minlength="8" maxlength="8" autocomplete="one-time-code" placeholder="12345678"></div><label for="newPassword">Password mpya ya duka</label><div class="field"><input id="newPassword" type="password" minlength="4" maxlength="128" autocomplete="new-password" placeholder="Angalau herufi/namba 4"></div><label for="confirmPassword">Rudia password mpya</label><div class="field"><input id="confirmPassword" type="password" minlength="4" maxlength="128" autocomplete="new-password" placeholder="Thibitisha password"></div><p id="verifyMessage" class="form-message" role="status"></p><button class="submit-button" id="saveBtn" type="button">THIBITISHA NA HIFADHI</button><a class="stage-back" href="./setup.html">Rudi hatua ya kwanza</a></section></main><script type="module" src="setup-verify.js"></script></body></html>
