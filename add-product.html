<section class="content"><div class="heading"><div><p class="eyebrow">ZUNE SELLER CENTER</p><h1 data-sw="Ongeza bidhaa mpya">Add a new product</h1><p class="muted" data-sw="Jaza taarifa za bidhaa yako ili ichapishwe dukani.">Enter your product details to publish it in your store.</p></div></div>
<section class="panel" style="background:#fff;border:1px solid #e8efeb;border-radius:16px;padding:clamp(16px,3vw,28px);max-width:850px"><form id="productForm"><label data-sw="Jina la bidhaa">Product name<input name="title" required maxlength="120" placeholder="Mfano: Viatu vya michezo"></label><div class="form-row"><label data-sw="Bei ya bidhaa (TSh)">Price (TSh)<input name="price" type="number" min="1" step="1" required></label><label data-sw="Idadi ya stock">Stock quantity<input name="stock_quantity" type="number" min="0" step="1" required></label></div><div class="form-row"><label data-sw="Punguzo (%)">Discount (%)<input name="discount_percent" type="number" min="0" max="100" step="1" value="0"></label><label data-sw="Bei baada ya punguzo">Discounted price<input id="discountedPrice" type="text" readonly placeholder="TSh —"></label></div><label data-sw="Picha za bidhaa (hadi 20)">Product photos (up to 20)<input name="images" id="productImages" type="file" accept="image/jpeg,image/png,image/webp" multiple><small class="field-hint" data-sw="Chagua picha kutoka kwenye simu. Picha ya kwanza itaonekana kama picha kuu.">Choose photos from your phone. The first photo will be the main image.</small></label><div id="imagePreview" class="image-preview"></div><label data-sw="Aina ya bidhaa">Category<select name="category_id" id="categorySelect" required><option value="">Inapakia categories…</option></select></label><label data-sw="Maelezo ya bidhaa">Description<textarea name="description" rows="4" maxlength="2000"></textarea></label><div class="form-actions"><a class="secondary" href="products.html" style="text-decoration:none;display:inline-flex;align-items:center" data-sw="Ghairi">Cancel</a><button type="submit" class="primary" id="saveProduct" data-sw="Hifadhi bidhaa">Save product</button></div></form></section></section></main></div>
